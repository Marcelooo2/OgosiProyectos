services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: skillgrow
      POSTGRES_USER: skillgrow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - skillgrow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillgrow -d skillgrow"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://skillgrow:${POSTGRES_PASSWORD}@db:5432/skillgrow
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  skillgrow_data:
